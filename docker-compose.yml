services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SITEWISE_SERVICE: api
    depends_on:
      - mcp

  mcp:
    build: ./apps/mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      SITEWISE_SERVICE: mcp

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
