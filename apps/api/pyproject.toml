[project]
name = "sitewise-api"
version = "0.1.0"
description = "Sitewise FastAPI + ADK runtime (Person B owns routes/auth, Person A owns gateway/agents)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "sitewise-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sitewise_api"]

[tool.uv.sources]
sitewise-contracts = { workspace = true }
