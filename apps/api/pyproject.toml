[project]
name = "sitewise-api"
version = "0.1.0"
description = "Sitewise FastAPI + ADK runtime (Person B owns routes/auth, Person A owns gateway/agents)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sitewise-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sitewise_api"]

[tool.uv.sources]
sitewise-contracts = { workspace = true }
